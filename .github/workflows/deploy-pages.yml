name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-hanews-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the sitemap generator reads each page's last git
          # commit date, and a depth-1 clone cannot see those commits.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Regenerate sitemap.xml from the tracked page list + git dates on every
      # push, so the sitemap never goes stale as briefs are added.
      - name: Generate sitemap.xml
        run: python3 scripts/generate-sitemap.py

      - name: Deploy to Pages project hanews
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "47fc5188afc9aa2306c4f30dc9e3cc30"
          # Direct-upload to the existing production project (domains + secrets live here).
          # Native Git cannot attach to a Direct Upload project; this is the push→live path.
          command: pages deploy . --project-name=hanews
